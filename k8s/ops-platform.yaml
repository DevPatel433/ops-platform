apiVersion: v1
kind: Namespace
metadata:
  name: ops-platform
---
# Replace the password before deploying. Prefer an external secret manager in production.
apiVersion: v1
kind: Secret
metadata:
  name: ops-db
  namespace: ops-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://ops:change-me@postgres:5432/ops
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ops-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ops-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: ops
            - name: POSTGRES_DB
              value: ops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ops-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-api-config
  namespace: ops-platform
data:
  CHECK_INTERVAL_SECONDS: "15"
  RUNBOOK_DIR: /app/runbooks
  MONITORED_SERVICES: '[{"name":"ops-api","health_url":"http://ops-api:8000/health","owner":"platform"}]'
---
apiVersion: v1
kind: Service
metadata:
  name: ops-api
  namespace: ops-platform
  labels:
    app: ops-api
spec:
  selector:
    app: ops-api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-api
  namespace: ops-platform
spec:
  # Keep at 1 replica: each pod runs the background monitor, so more replicas would duplicate checks.
  replicas: 1
  selector:
    matchLabels:
      app: ops-api
  template:
    metadata:
      labels:
        app: ops-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: ops-api
          image: ghcr.io/your-org/ops-platform-api:1.0.0
          envFrom:
            - configMapRef:
                name: ops-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-db
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
